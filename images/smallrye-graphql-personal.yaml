name: tpl-smallrye-graphql-personal
description: SmallRye GraphQL + Quarkus development box - personal
parent: tpl-mydev
accounts:
  claude: personal
tools:
  - podman
  - mvnd
  - claude: {model: claude-sonnet-5}
default-action: claude
packages:
 - unzip
repos:
  - url: https://github.com/quarkusio/quarkus.git
    # Resolve dependencies breadth-first, in parallel: through the isx proxy every cached
    # artifact is confirmed with Maven Central, which depth-first resolution pays one
    # round trip at a time. Measured 16s instead of 44s resolving a Quarkus app on mvnd.
    # mvnd reads resolver settings only from its command line, not MAVEN_OPTS.
    prime: mvnd -b singlethreaded -Dquickly -Daether.dependencyCollector.impl=bf
  - url: https://github.com/smallrye/smallrye-graphql.git
    path: ~/smallrye-graphql
